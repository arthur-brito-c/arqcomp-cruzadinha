<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monte o computador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Rabiscos decorativos do fundo -->
  <div class="doodles" aria-hidden="true">
    <span class="doodle anel"></span>
    <span class="doodle estrela"></span>
    <span class="doodle triangulo"></span>
    <svg class="doodle rabisco" viewBox="0 0 120 30"><path d="M4 15 Q19 0 34 15 T64 15 T94 15 T116 15" /></svg>
  </div>

  <!-- Chuva de confete (aparece quando o jogador acerta tudo) -->
  <div id="confete" class="confete" aria-hidden="true"></div>

  <header>
    <div class="titulo-area">
      <!-- Mascote: um chip com olhos que seguem o mouse -->
      <svg class="mascote" viewBox="0 0 120 120" aria-hidden="true">
        <g class="pernas">
          <rect x="4" y="32" width="18" height="9" rx="3" />
          <rect x="4" y="56" width="18" height="9" rx="3" />
          <rect x="4" y="80" width="18" height="9" rx="3" />
          <rect x="98" y="32" width="18" height="9" rx="3" />
          <rect x="98" y="56" width="18" height="9" rx="3" />
          <rect x="98" y="80" width="18" height="9" rx="3" />
        </g>
        <rect class="corpo" x="18" y="14" width="84" height="92" rx="20" />
        <circle class="olho" cx="44" cy="50" r="14" />
        <circle class="olho" cx="76" cy="50" r="14" />
        <g class="pupilas">
          <circle cx="44" cy="50" r="6" />
          <circle cx="76" cy="50" r="6" />
        </g>
        <circle class="bochecha" cx="30" cy="76" r="6" />
        <circle class="bochecha" cx="90" cy="76" r="6" />
        <path class="boca normal" d="M48 78 Q60 90 72 78" />
        <path class="boca feliz" d="M44 76 Q60 102 76 76 Z" />
        <path class="boca triste" d="M48 88 Q60 76 72 88" />
      </svg>

      <div>
        <p class="etiqueta">um joguinho de arquitetura computacional</p>
        <h1>Monte o <span>computador</span></h1>
      </div>
    </div>
    <p class="instrucao">Clique numa casa numerada para ler a pista. Depois cole o termo certo
       nela: clicando no termo ou arrastando até a casa.</p>
  </header>

  <main>
    <section class="diagrama">

      <div class="micro">
        <div class="topo"><button type="button" class="slot" data-resposta="MICROCONTROLADOR"></button></div>

        <div class="cpu">
          <div class="topo"><button type="button" class="slot" data-resposta="CPU"></button></div>
          <div class="grupo">
            <button type="button" class="slot" data-resposta="UC"></button>
            <button type="button" class="slot" data-resposta="ULA"></button>
            <button type="button" class="slot" data-resposta="REGISTRADORES"></button>
            <button type="button" class="slot" data-resposta="CACHE"></button>
          </div>
        </div>

        <div class="barramentos">
          
          <div class="grupo">
            <button type="button" class="slot" data-resposta="ADDRESSBUS"></button>
            <button type="button" class="slot" data-resposta="DATABUS"></button>
          </div>
        </div>

        <div class="memorias">
        
          <div class="grupo">
            <button type="button" class="slot" data-resposta="RAM"></button>
            <button type="button" class="slot" data-resposta="ROM"></button>
            <button type="button" class="slot" data-resposta="EEPROM"></button>
            <button type="button" class="slot" data-resposta="FLASH"></button>
          </div>
        </div>
      </div>

      <div class="fora">
        <div class="caixa">
      
          <button type="button" class="slot" data-resposta="MEMORIADEMASSA"></button>
        </div>
        <div class="caixa">
        
          <button type="button" class="slot" data-resposta="DMA"></button>
        </div>
      </div>

      <div class="fora">
        <div class="caixa">
        
          
          <button type="button" class="slot" data-resposta="DUALCORE"></button>
        </div>
        <div class="caixa">
         
        
          <button type="button" class="slot" data-resposta="QUADCORE"></button>
        </div>
      </div>

    </section>

    <aside class="lateral">
      <div id="pista" class="pista"><span class="texto">Clique numa casa do diagrama para ler a pista.</span></div>

      <h2>Termos</h2>
      <div id="banco" class="banco"></div>

      <div class="controles">
        <button id="btn-conferir" type="button">Conferir</button>
        <button id="btn-reiniciar" type="button" class="secundario">Reiniciar</button>
      </div>

      <div class="barra"><div id="barra-preenchida"></div></div>
      <p id="contador" aria-live="polite">0 de 16 componentes</p>
      <p id="recado" class="recado"></p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
